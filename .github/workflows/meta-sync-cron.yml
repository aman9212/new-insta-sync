name: Meta API Auto View Sync Cron

on:
  schedule:
    - cron: '0 * * * *' # Runs every 1 hour
  workflow_dispatch:

jobs:
  sync-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Run Meta API View Sync Engine
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
          VITE_META_APP_ID: ${{ secrets.VITE_META_APP_ID }}
          VITE_META_APP_SECRET: ${{ secrets.VITE_META_APP_SECRET }}
        run: npx tsx scripts/test-meta-sync.ts --full-sync
